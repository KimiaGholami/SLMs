# Computes all paper statistics from the saved logits (CPU only).
# Output: /output/slm-logits/stats/{stats.json,cosine.npz,report.md} (a few MB).
#   kubectl apply -f compute-stats.yaml
#   kubectl logs -f job/kimia-slm-compute-stats
apiVersion: batch/v1
kind: Job
metadata:
  name: kimia-slm-compute-stats
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: stats
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install "numpy<2" && \
            cd /opt/repo/slms/Pipeline && \
            python3 compute_stats.py --logits /output/slm-logits --out /output/slm-logits/stats --workers 8
        volumeMounts:
          - name: pipeline-code
            mountPath: /opt/repo/slms/Pipeline
          - name: plot-output
            mountPath: /output
        resources:
          limits:
            memory: 32Gi
            cpu: "8"
          requests:
            memory: 32Gi
            cpu: "8"
      volumes:
        - name: pipeline-code
          configMap:
            name: slm-pipeline
        - name: plot-output
          persistentVolumeClaim:
            claimName: cache-4t-rwm
